name: Deploy LATEXRENDER to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The browser loads css/dist/bundle.css and js/dist/bundle.js, not the
      # files under css/ and js/. Editing a source without rebuilding used to
      # ship nothing, silently. This fails the deploy instead.
      - name: Verify bundles match their sources
        run: python scripts/build_bundles.py --check

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Source Code to Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Source Code'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
